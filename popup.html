<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Now</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="app">

    <!-- ══════════════════════════════════════════════════════════════
         HEADER — 3-row layout
         Row 1: Logo  |  Unwatched counter  |  Rescan
         Row 2: Search bar  |  Sort dropdown
         Row 3: Filter toggle  |  Surprise Me
         ══════════════════════════════════════════════════════════════ -->
    <header id="app-header">

      <!-- Row 1 -->
      <div class="header-row header-row--top">
        <span class="logo">▶ Watch Now</span>

        <span id="unwatched-counter" class="unwatched-counter" aria-live="polite">
          <!-- populated by popup.js -->
        </span>

        <button id="rescan-btn" class="btn-rescan" title="Re-scan playlist">
          ↺ Rescan
        </button>
      </div>

      <!-- Row 2 -->
      <div class="header-row header-row--search" id="header-row-search">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search videos…"
          aria-label="Search videos"
        />
        <select id="sort-select" class="sort-select" aria-label="Sort order" title="Sort videos">
          <option value="new">New</option>
          <option value="old">Old</option>
          <option value="shuffle">Shuffle</option>
        </select>
      </div>

      <!-- Row 3 -->
      <div class="header-row header-row--actions" id="header-row-actions">
        <!-- Filter toggle -->
        <div class="filter-toggle" role="group" aria-label="Filter videos">
          <button
            class="filter-btn filter-btn--active"
            data-filter="all"
            id="filter-all"
            aria-pressed="true"
          >All</button>
          <button
            class="filter-btn"
            data-filter="unwatched"
            id="filter-unwatched"
            aria-pressed="false"
          >Unwatched</button>
        </div>

        <!-- Surprise Me -->
        <button id="surprise-btn" class="btn-surprise" title="Open a random video">
          🎲 Surprise Me
        </button>
      </div>

    </header>

    <!-- ── Views ──────────────────────────────────────────────────── -->

    <!-- Loading -->
    <div id="loadingView" class="view" aria-live="polite">
      <div class="loading-inner">
        <div class="spinner"></div>
        <p class="loading-title">Scanning your playlist…</p>
        <p id="loading-count" class="loading-count">0 videos found</p>
        <p class="loading-hint">Keep the Watch Later tab open while scanning.</p>
      </div>
    </div>

    <!-- Error -->
    <div id="errorView" class="view">
      <div class="error-inner">
        <div class="error-icon">⚠</div>
        <p class="error-title">Watch Later tab not found</p>
        <p class="error-body">
          Open your
          <a
            href="https://www.youtube.com/playlist?list=WL"
            target="_blank"
            rel="noopener noreferrer"
            class="link"
          >Watch Later playlist</a>
          in a YouTube tab, then click Rescan.
        </p>
        <button id="error-open-btn" class="btn-primary">Open Watch Later</button>
      </div>
    </div>

    <!-- Empty -->
    <div id="emptyView" class="view">
      <div class="empty-inner">
        <div class="empty-icon">📭</div>
        <p class="empty-title">Your Watch Later is empty</p>
        <p class="empty-body">Add some videos and click Rescan.</p>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="videoGrid" class="view">
      <div id="grid-container" class="grid-container"></div>
      <div id="no-results" class="no-results hidden">No videos match your search.</div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
